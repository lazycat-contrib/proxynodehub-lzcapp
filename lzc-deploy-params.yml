params:
  # 登录管理密码：默认随机生成（24 位），避免弱口令；安装时也可自定义（12–1024 字符）
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "登录管理密码（至少 12 个字符；默认随机生成）"
    default_value: "$random(len=24)"

  # 可选：GitHub API Token，提高仓库搜索配额；也可稍后在应用内「服务设置」配置
  - id: github_token
    type: secret
    name: "GitHub Token"
    description: "可选的 GitHub API Token（提高搜索配额）；留空即可，稍后也能在应用内配置"
    default_value: ""
    optional: true

locales:
  zh:
    admin_password:
      name: "管理员密码"
      description: "登录管理密码（至少 12 个字符；默认随机生成，登录页会自动填充）"
    github_token:
      name: "GitHub Token"
      description: "可选的 GitHub API Token（提高搜索配额）；留空即可，稍后也能在应用内配置"
  zh_CN:
