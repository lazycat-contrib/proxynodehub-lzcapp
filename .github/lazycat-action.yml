version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/proxynodehub.lpk
  target_arch: amd64

# 版本跟随上游镜像的 digest：latest 变化时自动 patch 递增并发布；
# digest 未变则幂等跳过（不重复发版）。
update:
  strategy: publish
  version_source:
    type: image
    image: proxynodehub
    bump: patch

build:
  run_buildscript: false

images:
  - id: proxynodehub
    target: service
    service: proxynodehub
    source: docker.io/helloworldz1024/proxynodehub
    channel: custom
    sort: created
    tag_regex: '^latest$'
    delivery:
      mode: mirror
      image_template: docker.1ms.run/helloworldz1024/proxynodehub:{tag}
      require_digest_match: true

stores:
  official:
    # 仅发布喵喵（私有）商店；官方平台不发布
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: ProxyNodeHub
    summary: "发现 GitHub 上活跃的免费节点仓库，自动去重并生成可用订阅链接"
